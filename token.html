<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Token</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        🍔 <span>Smart</span>Canteen
    </div>

</header>

<main class="token-page">

    <div class="token-card">

        <div class="success">
            ✓ ORDER CONFIRMED
        </div>

        <h1>Your Smart Token</h1>

        <div class="token-number" id="tokenNumber">
            024
        </div>

        <p>
            Order ID:
            <strong id="orderId">SC1024</strong>
        </p>

        <div class="qr">

            <div class="qr-pattern">
                █▀▀▀█ ▄▄▄ █▀▀▀█<br>
                █ █ █ ▀▄▀ █ █ █<br>
                █▄▄▄█ ▄▄▄ █▄▄▄█<br>
                ▄▄▄ ▀█▀ ▄▀▄ ▄▄▄<br>
                █ ▀▄ █▄▄ ▀█ █ ▀<br>
                ▀▀▀▀▀ ▀▀▀ ▀▀▀▀▀
            </div>

            <p>SCAN TO PICK UP</p>

        </div>

        <div class="steps">

            <div class="active">✓ Order Placed</div>
            <div>● Preparing</div>
            <div>○ Ready</div>
            <div>○ Picked Up</div>

        </div>

        <a href="menu.html" class="outline-btn">
            Order More Food
        </a>

    </div>

</main>

<script src="js/app.js"></script>

</body>
</html>
