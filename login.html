<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">🍔</div>

        <h1>Student Login</h1>

        <p>Welcome to Smart Canteen</p>

        <input
            type="text"
            id="loginId"
            placeholder="Student ID"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >

        <button class="btn full" onclick="login()">
            Login
        </button>

        <div class="line">OR</div>

        <h3>Create Account</h3>

        <input
            type="text"
            id="registerName"
            placeholder="Full Name"
        >

        <input
            type="text"
            id="registerId"
            placeholder="Student ID"
        >

        <input
            type="email"
            id="registerEmail"
            placeholder="Email"
        >

        <input
            type="password"
            id="registerPassword"
            placeholder="Password"
        >

        <button class="outline-btn full" onclick="register()">
            Register
        </button>

        <a href="index.html" class="back">
            ← Back Home
        </a>

    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
